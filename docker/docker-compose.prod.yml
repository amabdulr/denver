# =============================================================
# Denver App – Production Docker Compose (self-contained)
#
# Fully self-contained deployment:
#   - Image ships with empty knowledge_docs/ subfolders
#   - ontology/ is baked into the image
#   - Admin tab downloads product PDFs at runtime
#   - All runtime data persists in Docker volumes
#
# On a NEW server, all you need is:
#   - This repo (git clone)
#   - A filled-in docker/.env file with your API keys
#   - Run: docker compose -f docker/docker-compose.prod.yml up --build
#   - Use the Admin tab to download product documentation
# =============================================================
version: "3.9"

services:
  denver-app:
    build:
      context: ..                       # project root is the build context
      dockerfile: docker/Dockerfile     # path to Dockerfile relative to context
    container_name: denver-app-prod
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env                            # secrets live in the docker/ folder
    environment:
      - PYTHONUNBUFFERED=1              # real-time log output
    volumes:
      # Persist the vector store across container restarts
      - vectorstore_data:/root/.denver_vectorstore
      # Persist downloaded knowledge docs (Admin tab populates these)
      - knowledge_docs_data:/app/knowledge_docs
      # Persist app config and ontology edits
      - app_config_data:/app/config
      # Persist data directory for ingestion metadata / heading cache
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  vectorstore_data:
    driver: local
  knowledge_docs_data:
    driver: local
  app_config_data:
    driver: local
  app_data:
    driver: local
