# =============================================================
# Denver App – Docker Compose
#
# Run from the project root:
#   docker compose -f docker/docker-compose.yml up --build
# =============================================================
version: "3.9"

services:
  denver-app:
    build:
      context: ..                       # project root is the build context
      dockerfile: docker/Dockerfile     # path to Dockerfile relative to context
    container_name: denver-app
    restart: unless-stopped
    ports:
      - "8503:8501"
    env_file:
      - .env                            # secrets live in the docker/ folder
    environment:
      - PYTHONUNBUFFERED=1              # real-time log output
    volumes:
      # Persist the vector store across container restarts
      - vectorstore_data:/root/.denver_vectorstore
      # Persist app config (saved product, tester name, etc.)
      - ../config/app_config.json:/app/config/app_config.json
      # Mount knowledge_docs so you can update docs without rebuilding
      - ../knowledge_docs:/app/knowledge_docs
      # Mount data directory for ingestion metadata / heading cache
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  vectorstore_data:
    driver: local
